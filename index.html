<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eel Restaurant - Smart Display (Google Sheets)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; overflow-x: hidden; }
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #065f46, #047857, #064e3b, #065f46);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .transition-all-500 { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <!-- ส่วนเลือกโหมดการใช้งาน -->
    <div id="mode-selector" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-6 text-center">
        <div class="max-w-md w-full space-y-10">
            <h1 class="text-6xl font-black text-emerald-400 italic tracking-tighter uppercase drop-shadow-lg">EEL RESTAURANT</h1>
            <div class="grid grid-cols-1 gap-5">
                <button onclick="selectMode('customer')" class="flex flex-col items-center p-8 bg-slate-800 border-2 border-slate-700 rounded-[2.5rem] hover:border-emerald-500 transition-all group">
                    <span class="text-5xl mb-3 group-hover:scale-110 transition-transform">📺</span>
                    <span class="text-2xl font-bold">จอสำหรับลูกค้า</span>
                    <span class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest font-black">Customer Display Mode</span>
                </button>
                <button onclick="selectMode('staff')" class="flex flex-col items-center p-8 bg-slate-800 border-2 border-slate-700 rounded-[2.5rem] hover:border-blue-500 transition-all group">
                    <span class="text-5xl mb-3 group-hover:scale-110 transition-transform">📱</span>
                    <span class="text-2xl font-bold">จอสำหรับพนักงาน</span>
                    <span class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest font-black">Staff Controller Mode</span>
                </button>
            </div>
            <div class="space-y-1">
                <p class="text-[10px] text-emerald-500 font-black uppercase tracking-widest">System Status: Ready (GAS)</p>
                <p class="text-[10px] text-slate-600 uppercase tracking-widest">ใช้ Google Sheets เป็นตัวควบคุม</p>
            </div>
        </div>
    </div>

    <!-- หน้าจอลูกค้า (Customer View) -->
    <div id="view-customer" class="hidden h-screen w-screen flex flex-row overflow-hidden bg-white">
        <!-- ฝั่งซ้าย: โปรโมชั่น -->
        <div id="promo-section" class="flex-[1.8] relative flex flex-col items-center justify-center p-20 transition-all-500 bg-gradient-animate overflow-hidden text-white">
            <div class="absolute top-12 left-12 flex items-center gap-4">
                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-slate-900 font-black text-3xl italic shadow-2xl">E</div>
                <div class="text-left">
                    <h2 class="text-3xl font-black uppercase tracking-tighter leading-none">Eel Restaurant</h2>
                    <p class="text-xs font-bold tracking-[0.3em] opacity-70 uppercase">Authentic Taste</p>
                </div>
            </div>
            
            <div class="text-center space-y-10 z-10">
                <div class="w-[550px] h-[380px] bg-black/20 backdrop-blur-md rounded-[3rem] border-4 border-white/30 flex items-center justify-center shadow-2xl overflow-hidden">
                    <span id="promo-icon" class="text-9xl">🥘</span>
                </div>
                <div class="space-y-4">
                    <h3 id="display-promo-title" class="text-7xl font-extrabold uppercase tracking-tighter drop-shadow-lg">---</h3>
                    <p id="display-promo-desc" class="text-3xl font-medium opacity-90 max-w-xl mx-auto">---</p>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: QR Payment -->
        <div class="flex-1 bg-white flex flex-col items-center justify-center p-12 text-slate-900 border-l-4 border-slate-50">
            <div id="qr-content" class="w-full text-center space-y-12"></div>
        </div>
    </div>

    <!-- หน้าจอพนักงาน (Staff View) -->
    <div id="view-staff" class="hidden min-h-screen bg-slate-50 text-slate-900 p-4 pb-12 overflow-y-auto">
        <div class="max-w-md mx-auto space-y-8">
            <header class="flex justify-between items-center py-4 bg-white px-4 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold italic">E</div>
                    <h2 class="text-xl font-black text-slate-800 uppercase italic">Eel Control</h2>
                </div>
                <button onclick="location.reload()" class="p-2 bg-slate-100 rounded-full text-lg">🔄</button>
            </header>

            <!-- Live Status -->
            <div class="bg-slate-900 p-6 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                <p class="text-[10px] font-bold text-emerald-500 mb-4 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> Live Status
                </p>
                <div class="flex items-center gap-4">
                    <div id="staff-status-ico" class="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center text-2xl">🖼️</div>
                    <div class="flex-1">
                        <p id="staff-status-title" class="font-bold text-lg truncate">เชื่อมต่อ...</p>
                        <p id="staff-status-qr" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">QR: ---</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-4">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-2 italic">💳 สลับ QR Code ลูกค้า</h3>
                <div class="grid grid-cols-1 gap-3">
                    <button id="btn-qr-ibank" onclick="updateRemote('ibank', currentState.currentPromo, false)" class="bg-white p-5 rounded-2xl shadow-sm border-2 border-transparent active:scale-95 transition-all text-left flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center font-black italic text-xl">i</div>
                            <div>
                                <p class="font-bold text-slate-800 text-lg">ธนาคารอิสลาม</p>
                                <p class="text-xs text-slate-500">ไฟล์: qr01.jpg</p>
                            </div>
                        </div>
                    </button>
                    <button id="btn-qr-general" onclick="updateRemote('general', currentState.currentPromo, false)" class="bg-white p-5 rounded-2xl shadow-sm border-2 border-transparent active:scale-95 transition-all text-left flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-black italic text-xl">P</div>
                            <div>
                                <p class="font-bold text-slate-800 text-lg">พร้อมเพย์ / ทั่วไป</p>
                                <p class="text-xs text-slate-500">ไฟล์: qr02.jpg</p>
                            </div>
                        </div>
                    </button>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <button onclick="updateRemote('none', currentState.currentPromo, true)" class="bg-emerald-600 text-white p-5 rounded-2xl font-bold active:scale-95 shadow-lg">✨ แจ้งขอบคุณ</button>
                        <button onclick="updateRemote('none', currentState.currentPromo, false)" class="bg-slate-200 text-slate-600 p-5 rounded-2xl font-bold active:scale-95">🚫 ปิดหน้า QR</button>
                    </div>
                </div>
            </div>

            <!-- Slide Control -->
            <div class="space-y-4">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-2 italic">🖼️ สลับโปรโมชั่น</h3>
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 flex justify-between items-center">
                    <button onclick="switchPromo(-1)" class="w-14 h-14 bg-slate-100 hover:bg-slate-200 rounded-full text-2xl font-bold active:scale-90 transition-all flex items-center justify-center">‹</button>
                    <div class="text-center">
                        <p class="text-4xl font-black text-slate-800 italic" id="staff-idx">1</p>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Active Slide</p>
                    </div>
                    <button onclick="switchPromo(1)" class="w-14 h-14 bg-slate-100 hover:bg-slate-200 rounded-full text-2xl font-bold active:scale-90 transition-all flex items-center justify-center">›</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // *** GOOGLE APPS SCRIPT CONFIGURATION ***
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiQETy4TKrnGQXd7BVqWTE0EyZBfKSu5FuXpAtRKWaoIPjva468G6DWFXZzkKp6VKJ/exec";

        let currentState = { qrType: 'none', currentPromo: 0, showThanks: false };
        const PROMOTIONS = [
            { title: "EEL SPECIAL SET", desc: "ชุดครอบครัวอีล รวมเมนูเด็ด ลดทันที 10%", color: "bg-emerald-700", icon: "🍱" },
            { title: "SPICY SOUP", desc: "ซุปหางวัวสูตรเข้มข้น รสเด็ดสะใจ", color: "bg-orange-600", icon: "🥣" },
            { title: "COLLECT POINTS", desc: "ทานครบ 1,000.- รับสิทธิ์ลุ้นรางวัลพิเศษ", color: "bg-blue-700", icon: "🏆" }
        ];

        function selectMode(mode) {
            document.getElementById('mode-selector').classList.add('hidden');
            if (mode === 'customer') {
                document.getElementById('view-customer').classList.remove('hidden');
                // จอลูกค้าจะดึงข้อมูลใหม่ทุกๆ 2 วินาที (Real-time polling)
                setInterval(fetchState, 2000);
            } else {
                document.getElementById('view-staff').classList.remove('hidden');
                fetchState();
            }
        }

        async function fetchState() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                currentState = data;
                refreshUI();
            } catch (e) {
                console.error("Connection lost. Retrying...");
            }
        }

        async function updateRemote(qrType, promoIdx, showThanks) {
            // อัปเดตฝั่งพนักงานทันที (Optimistic UI)
            currentState = { qrType, currentPromo: promoIdx, showThanks };
            refreshUI();
            
            // ส่งข้อมูลไปบันทึกใน Google Sheets
            const url = `${SCRIPT_URL}?action=update&qrType=${qrType}&currentPromo=${promoIdx}&showThanks=${showThanks}`;
            try {
                await fetch(url);
            } catch (e) {
                console.error("Failed to update Sheets");
            }
        }

        function switchPromo(dir) {
            const nextIdx = (currentState.currentPromo + dir + PROMOTIONS.length) % PROMOTIONS.length;
            updateRemote(currentState.qrType, nextIdx, currentState.showThanks);
        }

        function refreshUI() {
            const promo = PROMOTIONS[currentState.currentPromo] || PROMOTIONS[0];
            
            // -- อัปเดตหน้าจอลูกค้า --
            const customerTitle = document.getElementById('display-promo-title');
            if (customerTitle) {
                document.getElementById('promo-section').className = `flex-[1.8] relative flex flex-col items-center justify-center p-20 transition-all-500 ${promo.color} text-white overflow-hidden bg-gradient-animate`;
                customerTitle.innerText = promo.title;
                document.getElementById('display-promo-desc').innerText = promo.desc;
                document.getElementById('promo-icon').innerText = promo.icon;
                
                const qrArea = document.getElementById('qr-content');
                if (currentState.showThanks) {
                    qrArea.innerHTML = `<div class="animate-in zoom-in duration-500 text-center space-y-10"><div class="text-9xl">✨</div><h3 class="text-6xl font-black text-slate-900 uppercase leading-none tracking-tighter">THANK YOU!</h3><p class="text-2xl font-medium text-slate-400">ขอให้มีความสุขกับมื้ออาหารนะคะ</p></div>`;
                } else if (currentState.qrType === 'none') {
                    qrArea.innerHTML = `<div class="opacity-10 space-y-8 animate-in fade-in duration-1000 text-slate-900"><div class="text-9xl">🛒</div><h3 class="text-5xl font-black uppercase leading-none tracking-tighter">SCAN HERE</h3><p class="text-xl font-medium italic text-slate-400">กรุณาแจ้งพนักงานเพื่อรับ QR</p></div>`;
                } else {
                    const isIbank = currentState.qrType === 'ibank';
                    const qrImg = isIbank ? 'qr01.jpg' : 'qr02.jpg';
                    qrArea.innerHTML = `
                        <div class="animate-in zoom-in-95 duration-500 space-y-12 text-slate-900">
                            <div class="space-y-4">
                                <h3 class="text-6xl font-black uppercase leading-none tracking-tighter">SCAN NOW</h3>
                                <p class="text-2xl font-bold uppercase tracking-widest ${isIbank ? 'text-emerald-600' : 'text-blue-600'}">${isIbank ? 'ธนาคารอิสลาม (iBank)' : 'พร้อมเพย์ / ทั่วไป'}</p>
                            </div>
                            <div class="relative inline-block bg-white p-6 rounded-[3rem] shadow-2xl border-4 border-slate-50 overflow-hidden">
                                <img src="${qrImg}" class="w-80 h-80 object-contain rounded-[1.5rem]" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=MissingImage&color=ff0000'">
                            </div>
                            <div class="space-y-4">
                                <p class="bg-slate-50 px-8 py-3 rounded-full inline-block font-bold text-slate-700 border shadow-sm">ชื่อบัญชี: <span class="${isIbank ? 'text-emerald-700' : 'text-blue-700'}">ร้านอาหารอีล</span></p>
                            </div>
                        </div>`;
                }
            }

            // -- อัปเดตหน้าจอพนักงาน --
            const staffTitle = document.getElementById('staff-status-title');
            if (staffTitle) {
                staffTitle.innerText = promo.title;
                document.getElementById('staff-status-qr').innerText = `QR: ${currentState.qrType.toUpperCase()}`;
                document.getElementById('staff-idx').innerText = currentState.currentPromo + 1;
                document.getElementById('staff-status-ico').innerText = promo.icon;
                
                // Highlight Buttons
                const btnI = document.getElementById('btn-qr-ibank');
                const btnG = document.getElementById('btn-qr-general');
                btnI.style.borderColor = currentState.qrType === 'ibank' ? '#10b981' : 'transparent';
                btnG.style.borderColor = currentState.qrType === 'general' ? '#3b82f6' : 'transparent';
                btnI.style.background = currentState.qrType === 'ibank' ? '#f0fdf4' : 'white';
                btnG.style.background = currentState.qrType === 'general' ? '#eff6ff' : 'white';
            }
        }
    </script>
</body>
</html>
